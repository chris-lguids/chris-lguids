<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1056 460" width="1056" height="460" role="img" aria-label="Illustration of devices, a cat, coffee, a shield and a database all wired to a central monitor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .ink { stroke:#2B2D42; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .y   { fill:#F9E27D; }
    .y2  { fill:#FBEBA6; }
    .scr { fill:#4B4B5C; }
    .nof { fill:none; }
    .thin{ stroke:#2B2D42; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    .dot { fill:#2B2D42; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight:700; }
  </style>

  <!-- background -->
  <rect width="1056" height="460" fill="#F7DB5A"/>

  <!-- ============ CABLES (drawn first, sit behind devices) ============ -->
  <g class="ink nof">
    <path d="M291 117 H330 V194 H364"/>          <!-- phone -> monitor -->
    <path d="M170 95 H192 V238 H364"/>           <!-- shield -> monitor -->
    <path d="M160 282 H364"/>                    <!-- bug -> monitor -->
    <path d="M390 120 V150"/>                    <!-- coffee -> monitor -->
    <path d="M660 110 V150"/>                    <!-- cloud -> monitor -->
    <path d="M800 70 H735 V194 H692"/>           <!-- switch -> monitor -->
    <path d="M790 238 H692"/>                    <!-- laptop -> monitor -->
    <path d="M692 282 H740 V385 H760"/>          <!-- database -> monitor -->
    <path d="M850 385 H890"/>                    <!-- db -> terminal -->
    <path d="M528 364 V386"/>                    <!-- monitor -> rack -->
  </g>
  <!-- cable joints -->
  <g class="dot">
    <circle cx="330" cy="194" r="6"/><circle cx="192" cy="238" r="6"/><circle cx="735" cy="194" r="6"/>
    <circle cx="740" cy="385" r="6"/><circle cx="390" cy="135" r="6"/><circle cx="660" cy="135" r="6"/>
    <circle cx="270" cy="282" r="6"/><circle cx="740" cy="238" r="6"/>
  </g>

  <!-- ============ CENTRAL MONITOR ============ -->
  <g>
    <!-- stand -->
    <rect class="ink y" x="508" y="328" width="40" height="26"/>
    <rect class="ink y" x="466" y="352" width="124" height="14" rx="7"/>
    <!-- side ports -->
    <g class="ink y">
      <rect x="362" y="180" width="18" height="28" rx="3"/><rect x="362" y="224" width="18" height="28" rx="3"/><rect x="362" y="268" width="18" height="28" rx="3"/>
      <rect x="676" y="180" width="18" height="28" rx="3"/><rect x="676" y="224" width="18" height="28" rx="3"/><rect x="676" y="268" width="18" height="28" rx="3"/>
    </g>
    <!-- body -->
    <rect class="ink y" x="380" y="150" width="296" height="182" rx="14"/>
    <rect class="thin scr" x="398" y="168" width="260" height="146" rx="5"/>
    <rect x="399.500" y="169.500" width="34" height="143" rx="3" fill="#3B3B4A"/>
    <!-- window dots -->
    <circle cx="410" cy="178" r="2.500" fill="#F9E27D"/><circle cx="418" cy="178" r="2.500" fill="#6FCF97"/><circle cx="426" cy="178" r="2.500" fill="#5DA9E9"/>
    <!-- code lines -->
    <g>
      <rect x="446" y="192" width="70" height="6" rx="3" fill="#EDEDF3"/>
      <rect x="446" y="206" width="38" height="6" rx="3" fill="#6FCF97"/><rect x="490" y="206" width="56" height="6" rx="3" fill="#EDEDF3"/>
      <rect x="458" y="220" width="64" height="6" rx="3" fill="#5DA9E9"/>
      <rect x="458" y="234" width="30" height="6" rx="3" fill="#F5D547"/><rect x="494" y="234" width="46" height="6" rx="3" fill="#EDEDF3"/>
      <rect x="446" y="248" width="80" height="6" rx="3" fill="#6FCF97"/>
      <rect x="458" y="262" width="52" height="6" rx="3" fill="#EDEDF3"/>
      <rect x="446" y="276" width="34" height="6" rx="3" fill="#F5D547"/><rect x="486" y="276" width="60" height="6" rx="3" fill="#5DA9E9"/>
      <rect x="446" y="290" width="48" height="6" rx="3" fill="#EDEDF3"/>
    </g>
    <!-- sticker badge -->
    <g transform="rotate(-4 602 258)">
      <rect class="ink y" x="558" y="222" width="88" height="72" rx="7" style="stroke-width:4"/>
      <text class="mono" x="602" y="262" text-anchor="middle" font-size="30" fill="#2B2D42">CC</text>
      <rect x="570" y="272" width="64" height="14" rx="3" fill="#2B2D42"/>
      <text class="mono" x="602" y="283" text-anchor="middle" font-size="10" fill="#F9E27D">DEV·2026</text>
    </g>
  </g>

  <!-- ============ CAT ON A SPRING ============ -->
  <g>
    <path class="ink nof" d="M516 150 L540 144 L516 138 L540 132 L516 126 L540 120" style="stroke-width:4"/>
    <path class="ink y" d="M498 64 L493 30 L522 50 Z"/>
    <path class="ink y" d="M558 64 L563 30 L534 50 Z"/>
    <circle class="ink y" cx="528" cy="84" r="36"/>
    <circle class="dot" cx="514" cy="80" r="5"/><circle class="dot" cx="542" cy="80" r="5"/>
    <path class="dot" d="M523 90 H533 L528 96 Z"/>
    <path class="thin nof" d="M528 96 V100 M521 103 Q528 107 528 100 Q528 107 535 103"/>
    <path class="thin nof" d="M496 90 L478 86 M496 96 L478 99 M560 90 L578 86 M560 96 L578 99"/>
  </g>

  <!-- ============ SHIELD TILE (security) ============ -->
  <g>
    <rect class="ink y2" x="60" y="40" width="110" height="110" rx="10"/>
    <path class="ink scr" d="M115 62 L147 74 V98 C147 118 133 131 115 138 C97 131 83 118 83 98 V74 Z"/>
    <circle cx="115" cy="96" r="8" fill="#F9E27D"/>
    <path d="M115 100 V114" stroke="#F9E27D" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ============ PHONE (AI chat) ============ -->
  <g>
    <rect class="ink y" x="215" y="50" width="76" height="134" rx="11"/>
    <rect class="scr" x="223" y="62" width="60" height="106" rx="3"/>
    <rect x="229" y="72" width="36" height="12" rx="6" fill="#F9E27D"/>
    <rect x="241" y="92" width="36" height="12" rx="6" fill="#6FCF97"/>
    <rect x="229" y="112" width="28" height="12" rx="6" fill="#F9E27D"/>
    <rect x="241" y="132" width="36" height="12" rx="6" fill="#6FCF97"/>
    <circle class="dot" cx="253" cy="176" r="3"/>
  </g>

  <!-- ============ COFFEE TILE ============ -->
  <g>
    <rect class="ink y2" x="350" y="40" width="80" height="80" rx="9"/>
    <path class="thin nof" d="M378 64 c-5 -6 5 -8 0 -14 M390 64 c-5 -6 5 -8 0 -14 M402 64 c-5 -6 5 -8 0 -14"/>
    <path class="ink y" d="M372 70 H408 V92 C408 102 400 108 390 108 C380 108 372 102 372 92 Z" style="stroke-width:4"/>
    <path class="thin nof" d="M408 75 H414 C421 75 421 91 412 91 H408"/>
  </g>

  <!-- ============ CLOUD TILE ============ -->
  <g>
    <rect class="ink y2" x="620" y="40" width="80" height="80" rx="9"/>
    <path class="ink y" d="M640 96 C627 96 627 76 642 76 C644 62 666 60 670 73 C686 71 690 96 674 96 Z" style="stroke-width:4"/>
  </g>

  <!-- ============ NETWORK SWITCH ============ -->
  <g>
    <rect class="ink y" x="800" y="40" width="190" height="60" rx="8"/>
    <g class="scr">
      <rect x="814" y="54" width="16" height="16" rx="2"/><rect x="842" y="54" width="16" height="16" rx="2"/><rect x="870" y="54" width="16" height="16" rx="2"/>
      <rect x="898" y="54" width="16" height="16" rx="2"/><rect x="926" y="54" width="16" height="16" rx="2"/><rect x="954" y="54" width="16" height="16" rx="2"/>
    </g>
    <circle cx="822" cy="86" r="3.500" fill="#6FCF97"/><circle cx="850" cy="86" r="3.500" fill="#6FCF97"/><circle cx="878" cy="86" r="3.500" fill="#2B2D42"/>
    <circle cx="906" cy="86" r="3.500" fill="#6FCF97"/><circle cx="934" cy="86" r="3.500" fill="#E8735A"/><circle cx="962" cy="86" r="3.500" fill="#6FCF97"/>
  </g>

  <!-- ============ LAPTOP ============ -->
  <g>
    <rect class="ink y" x="772" y="302" width="236" height="14" rx="7"/>
    <rect class="ink y" x="790" y="190" width="200" height="112" rx="9"/>
    <rect class="thin y2" x="802" y="202" width="176" height="88" rx="3"/>
    <rect class="scr" x="810" y="210" width="76" height="72" rx="3"/>
    <rect class="scr" x="894" y="210" width="76" height="72" rx="3"/>
    <rect x="816" y="218" width="40" height="5" rx="2.500" fill="#EDEDF3"/><rect x="816" y="230" width="58" height="5" rx="2.500" fill="#6FCF97"/>
    <rect x="816" y="242" width="46" height="5" rx="2.500" fill="#5DA9E9"/><rect x="816" y="254" width="52" height="5" rx="2.500" fill="#EDEDF3"/>
    <rect x="900" y="218" width="58" height="5" rx="2.500" fill="#F5D547"/><rect x="900" y="230" width="40" height="5" rx="2.500" fill="#EDEDF3"/>
    <rect x="900" y="242" width="54" height="5" rx="2.500" fill="#6FCF97"/><rect x="900" y="254" width="34" height="5" rx="2.500" fill="#EDEDF3"/>
  </g>

  <!-- ============ DATABASE ============ -->
  <g>
    <path class="ink y" d="M760 356 V414 C760 424 780 430 805 430 C830 430 850 424 850 414 V356"/>
    <path class="thin nof" d="M760 378 C760 388 780 394 805 394 C830 394 850 388 850 378 M760 398 C760 408 780 414 805 414 C830 414 850 408 850 398"/>
    <ellipse class="ink y2" cx="805" cy="356" rx="45" ry="13"/>
  </g>

  <!-- ============ TERMINAL TILE ============ -->
  <g>
    <rect class="ink y" x="890" y="335" width="100" height="100" rx="10"/>
    <rect class="scr" x="900" y="345" width="80" height="80" rx="4"/>
    <path d="M912 370 L926 382 L912 394" stroke="#F9E27D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M934 396 H954" stroke="#6FCF97" stroke-width="5" stroke-linecap="round"/>
    <path d="M912 410 H958" stroke="#EDEDF3" stroke-width="4" stroke-linecap="round" opacity=".6"/>
  </g>

  <!-- ============ BUG TILE ("breaker of bugs") ============ -->
  <g>
    <rect class="ink y2" x="70" y="225" width="90" height="90" rx="9"/>
    <g class="dot">
      <ellipse cx="115" cy="274" rx="14" ry="19"/><circle cx="115" cy="250" r="8"/>
    </g>
    <path class="thin nof" d="M101 264 L86 255 M101 274 L83 274 M101 284 L86 293 M129 264 L144 255 M129 274 L147 274 M129 284 L144 293 M111 243 L106 235 M119 243 L124 235"/>
    <path d="M115 258 V290" stroke="#F9E27D" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ============ SERVER RACK ============ -->
  <g>
    <rect class="ink y" x="330" y="386" width="250" height="50" rx="7"/>
    <rect class="scr" x="344" y="396" width="104" height="9" rx="3"/><rect class="scr" x="344" y="414" width="104" height="9" rx="3"/>
    <circle cx="470" cy="400" r="4" fill="#6FCF97"/><circle cx="486" cy="400" r="4" fill="#6FCF97"/><circle cx="502" cy="400" r="4" fill="#E8735A"/>
    <path class="thin nof" d="M466 419 H566"/>
    <circle class="ink y2" cx="490" cy="419" r="5" style="stroke-width:3"/><circle class="ink y2" cx="530" cy="419" r="5" style="stroke-width:3"/>
  </g>

  <!-- ============ ROUTER ============ -->
  <g>
    <path class="ink nof" d="M245 396 L238 366 M285 396 L292 366"/>
    <rect class="ink y" x="222" y="394" width="84" height="38" rx="7"/>
    <circle cx="240" cy="413" r="4" fill="#6FCF97"/><circle cx="254" cy="413" r="4" fill="#F5D547"/>
    <rect class="scr" x="268" y="407" width="26" height="12" rx="3"/>
  </g>

  <!-- ============ NOTEBOOK + PEN ============ -->
  <g>
    <rect class="ink y" x="70" y="345" width="86" height="90" rx="7"/>
    <path class="thin nof" d="M88 345 V435 M142 345 V435"/>
    <g transform="rotate(-14 118 388)">
      <rect class="thin scr" x="97" y="366" width="42" height="42" rx="4"/>
      <text class="mono" x="118" y="394" text-anchor="middle" font-size="17" fill="#F9E27D">PY</text>
    </g>
    <rect class="ink y" x="172" y="352" width="16" height="66" rx="8"/>
    <path class="ink y" d="M172 418 H188 L180 434 Z"/>
    <path class="thin nof" d="M172 366 H188"/>
  </g>
</svg>
